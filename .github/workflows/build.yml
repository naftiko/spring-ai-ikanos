name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Against the released engine on Maven Central (io.ikanos:ikanos-engine, see <ikanos.version>).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B verify

  # Early warning against the next engine: naftiko/ikanos main, built as a local snapshot, so a
  # break shows up here rather than after the next engine release.
  build-engine-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      IKANOS_REF: main
      IKANOS_VERSION: 0.0.0-engine-next-SNAPSHOT
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build ikanos-engine from ${{ env.IKANOS_REF }}
        run: |
          git clone --depth 1 --branch "$IKANOS_REF" https://github.com/naftiko/ikanos.git "$RUNNER_TEMP/ikanos"
          mvn -B -q -f "$RUNNER_TEMP/ikanos/pom.xml" install -pl modules/ikanos-engine -am \
            -DskipTests -Djacoco.skip=true -Drevision="$IKANOS_VERSION"

      - name: Verify
        run: mvn -B verify -Dikanos.version="$IKANOS_VERSION"
