name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Against the released engine on Maven Central (io.ikanos:ikanos-engine, see <ikanos.version>).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B verify

  # Early warning against the next engine: naftiko/ikanos PR #810 (Restlet 3.0.0-m1 + Jackson 3
  # from #797, plus the #800/#801 embedding fixes). Runs without opentelemetry-sdk on the
  # classpath. Switch the ref to main once #810 merges; drop the job once a release contains it.
  build-engine-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      IKANOS_REF: fix/issue-800-801-engine-embedding
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build ikanos-engine from ${{ env.IKANOS_REF }}
        run: |
          git clone --depth 1 --branch "$IKANOS_REF" https://github.com/naftiko/ikanos.git "$RUNNER_TEMP/ikanos"
          mvn -B -q -f "$RUNNER_TEMP/ikanos/pom.xml" install -pl modules/ikanos-engine -am \
            -DskipTests -Djacoco.skip=true -Drevision=1.0.0-beta8-pr810-SNAPSHOT

      - name: Verify
        run: mvn -B verify -Ppr810
